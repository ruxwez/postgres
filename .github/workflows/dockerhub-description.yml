name: Docker Hub description

# Keeps the Docker Hub page in sync with README.md, which is what people see
# when they find the image there.

on:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/dockerhub-description.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: Update description
    runs-on: ubuntu-latest
    env:
      # Editing the description needs a Docker Hub token with the
      # "Read, Write, Delete" scope. It's kept apart from DOCKER_PERSONAL_KEY,
      # which only needs "Read & Write" to push images, so the build jobs
      # never get permission to delete anything.
      TOKEN: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN }}
    steps:
      - name: Check token
        if: env.TOKEN == ''
        run: |
          echo "::error::Missing secret DOCKERHUB_DESCRIPTION_TOKEN: a Docker Hub access token with the 'Read, Write, Delete' scope."
          exit 1

      - uses: actions/checkout@v4

      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ env.TOKEN }}
          repository: ruxwez/postgres
          short-description: PostgreSQL 14-18 with 80+ extensions. pgvector, PostGIS, TimescaleDB, pgmq, pg_cron...
          readme-filepath: README.md
          # Turns relative links (./.docs/...) into absolute GitHub URLs.
          enable-url-completion: true
